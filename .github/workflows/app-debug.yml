# Nome do fluxo de trabalho exibido na interface do GitHub Actions
name: Build Android APK

# Define quando este workflow será executado automaticamente
on:
  push:
    branches: [ "main" ]        # Dispara toda vez que houver um push na branch main
  pull_request:
    branches: [ "main" ]        # Dispara toda vez que houver um pull request para a branch main

# Concede permissões para o GitHub Actions interagir com o repositório
permissions:
  contents: write               # Necessário para criar e atualizar a página de Release do repositório

# Define os trabalhos (jobs) que serão executados em paralelo ou sequência
jobs:
  build:
    runs-on: ubuntu-latest      # Roda o job em um ambiente virtual Linux (Ubuntu) atualizado

    # Lista de passos sequenciais que compõem o job
    steps:
      # Passo 1: Baixa o código-fonte do repositório na máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Instala e configura o ambiente Java necessário para compilar Android
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'          # Distribuição Eclipse Temurin do Java
          java-version: '17'               # Versão 17 do JDK

      # Passo 3: Adiciona permissão de execução ao script do Gradle no projeto Linux
      - name: Dar permissão de execução ao Gradle
        run: chmod +x gradlew

      # Passo 4: Executa o comando do Gradle para compilar o APK em modo de depuração
      - name: Construir o APK Debug
        run: ./gradlew assembleDebug

      # Passo 5: Cria ou atualiza automaticamente uma Release no GitHub com o APK gerado
      - name: Publicar Release Automática com o APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') == false      # Evita loop infinito se usar tags
        with:
          files: app/build/outputs/apk/debug/app-debug.apk     # Caminho do arquivo APK gerado pelo Gradle
          tag_name: app-build                                 # Tag fixa para sobrescrever sempre a mesma release "latest"
          name: "Versão mais recente do app"                   # Título exibido na página da Release
          body: |
            APK gerado automaticamente pelo GitHub Actions a cada commit na branch principal a fim de visualizar o app durante o desenvolvimento.
            Último commit: ${{ github.sha }}  
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # Token de autenticação automática do GitHub
